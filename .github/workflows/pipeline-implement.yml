name: Pipeline — Implement

# Executes the full task loop (AG-03 → AG-08) using the pipeline/ output
# committed to the repo by the Architect run, then commits results back.
# Only trigger this after reviewing the manifest from the Architect run.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase number"
        required: true
        default: "1"

concurrency:
  group: pipeline-implement-${{ github.event.inputs.phase }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    env:
      PHASE: ${{ github.event.inputs.phase }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: {project-name}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: {project-name}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache opencode-ai
        id: cache-opencode
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: opencode-ai-1.14.48-${{ runner.os }}

      - name: Install opencode
        if: steps.cache-opencode.outputs.cache-hit != 'true'
        run: npm install -g opencode-ai@1.14.48 --prefix ~/.npm-global

      - name: Add opencode to PATH
        run: echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Pre-flight quality check
        run: pnpm exec tsc --noEmit
      - name: Pre-flight lint
        run: pnpm exec biome check packages/

      - name: Verify agent files
        run: |
          echo "Git commit: $(git rev-parse HEAD)"
          echo "Agent files present:"
          ls .opencode/agents/
          echo ""
          echo "Pipeline sentinel files (tasks already complete):"
          find "pipeline/phase-${PHASE}/" -name "security-report.md" 2>/dev/null | sort || echo "(none)"

      - name: Run pending migrations
        run: |
          if [ -d migrations ] && ls migrations/*.sql 2>/dev/null | head -1; then
            echo "Running migrations..."
            for f in migrations/*.sql; do
              echo "  Applying $f"
              psql "$DATABASE_URL" -f "$f"
            done
          else
            echo "No migrations to run"
          fi
        env:
          DATABASE_URL: postgresql://{project-name}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/{project-name}

      - name: Configure git for per-task commits
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run implementation (AG-03 → AG-08)
        run: SKIP_ARCHITECT=1 pnpm exec tsx orchestrator/src/index.ts --phase "$PHASE"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POSTGRES_USER: {project-name}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: {project-name}
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          DATABASE_URL: postgresql://{project-name}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/{project-name}
          # Add project-specific secrets and env vars here

      - name: Dump debug info on failure
        if: failure()
        run: |
          echo "════════════════════════════════════════"
          echo "  HALT.md"
          echo "════════════════════════════════════════"
          cat HALT.md 2>/dev/null || echo "(no HALT.md)"
          echo ""
          echo "════════════════════════════════════════"
          echo "  Gate failures (last attempt)"
          echo "════════════════════════════════════════"
          find "pipeline/phase-${PHASE}/" -name "gate-failures-*.txt" 2>/dev/null | sort | tail -1 | xargs cat 2>/dev/null || echo "(no gate failures file)"
          echo ""
          echo "════════════════════════════════════════"
          echo "  dev-output.md (last agent output — phase ${PHASE} only)"
          echo "════════════════════════════════════════"
          find "pipeline/phase-${PHASE}/" -name "dev-output*.md" 2>/dev/null | sort | tail -1 | xargs cat 2>/dev/null || echo "(no dev output for phase ${PHASE})"
          echo ""
          echo "════════════════════════════════════════"
          echo "  Last opencode output file (any)"
          echo "════════════════════════════════════════"
          find "pipeline/phase-${PHASE}/" -name "*-output*.md" 2>/dev/null | sort | tail -1 | xargs cat 2>/dev/null || echo "(no output files)"
          echo ""
          echo "════════════════════════════════════════"
          echo "  pnpm test output (last)"
          echo "════════════════════════════════════════"
          find "pipeline/phase-${PHASE}/" -name "test-red-output.txt" 2>/dev/null | sort | tail -1 | xargs tail -50 2>/dev/null || echo "(no test output)"

      - name: Commit and push remaining pipeline outputs
        if: success()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing remaining to commit (all tasks already pushed incrementally)"
          else
            git commit -m "chore(pipeline): phase ${PHASE} pipeline summary [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi
